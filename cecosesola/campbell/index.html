<style id="gatecss">
:root{--bg:#f7f3ec;--ink:#29241e;--ink3:#8a8073;--line2:#d6cab8;--surf:#fffdf9;--acc:#b4613a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1916;--ink:#ece5d8;--ink3:#8c8376;--line2:#4a4339;--surf:#24211d;--acc:#e0956a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1916;--ink:#ece5d8;--ink3:#8c8376;--line2:#4a4339;--surf:#24211d;--acc:#e0956a;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockmark{font-family:var(--serif);font-size:30px;line-height:1.15}
.locksub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin:16px 0 18px}
.lockin{width:100%;box-sizing:border-box;font-size:16px;padding:13px 14px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);color:var(--ink);font-family:var(--sans)}
.lockbtn{width:100%;margin-top:12px;background:var(--acc);color:var(--bg);border:0;font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:14px;cursor:pointer;border-radius:10px}
.lockerr{font-size:13px;color:var(--acc);margin-top:14px;min-height:14px}
</style>
</head>
<body>
<div class="lock" id="lock"><div class="lockbox">
  <div class="lockmark">Campbell call</div>
  <div class="locksub">Password</div>
  <input class="lockin" id="pw" type="password" autocomplete="current-password" aria-label="Password">
  <button class="lockbtn" id="open">Open</button>
  <div class="lockerr" id="lockerr"></div>
</div></div>

var PWKEY='cec-pw';
function $(i){return document.getElementById(i);}
function b64d(s){var bin=atob(s);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function decrypt(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(PAY.salt),iterations:PAY.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAY.iv)},key,b64d(PAY.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function mount(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  if(doc.title) document.title=doc.title;
  var g=$('gatecss'); if(g) g.remove();
  doc.head.querySelectorAll('style,link[rel="stylesheet"]').forEach(function(n){document.head.appendChild(document.importNode(n,true));});
  Array.prototype.forEach.call(doc.documentElement.attributes,function(a){document.documentElement.setAttribute(a.name,a.value);});
  Array.prototype.forEach.call(doc.body.attributes,function(a){document.body.setAttribute(a.name,a.value);});
  var scripts=[];
  doc.body.querySelectorAll('script').forEach(function(s){scripts.push(s.textContent);s.remove();});
  document.body.innerHTML=doc.body.innerHTML;
  scripts.forEach(function(t){var s=document.createElement('script');s.textContent=t;document.body.appendChild(s);});
}
async function tryUnlock(pw,remember){
  var D; try{ D=await decrypt(pw); }catch(e){return false;}
  if(remember){try{localStorage.setItem(PWKEY,pw);}catch(x){}}
  mount(D.html);
  return true;
}
$('open').onclick=async function(){
  var pw=$('pw').value; if(!pw)return;
  $('lockerr').textContent='';
  var ok=await tryUnlock(pw,true);
  if(!ok){$('lockerr').textContent='That is not it. Try again.';$('pw').select();}
};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('open').click();});
(async function(){
  var saved=null; try{saved=localStorage.getItem(PWKEY)||localStorage.getItem('aya-pw');}catch(x){}
  if(saved){var ok=await tryUnlock(saved,true); if(ok) return; try{localStorage.removeItem(PWKEY);}catch(x){}}
  if($('pw')) $('pw').focus();
})();
</script>
