<title>Marea</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-drop3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marea">
<meta name="theme-color" content="#4a55ac">
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#f4f1e8; --surface:#fdfbf5; --surface2:#efeade; --ink:#2b2721; --ink2:#6d6557;
  --line:#e2dbca; --accent:#9c6b3f; --accent2:#5c7a4f;
  --t0:#e6eaf6;--t1:#bcc4ec;--t2:#8b95d8;--t3:#4a55ac;--t4:#262a63;
  --c-period:#c0574f; --moon-full:#e7d488;--moon-shade:#c9b45f;--moon-ring:#8a8262;--moon-dark:#312d22;
  --kevin:#c17a63; --hild:#7d8a4e; --berlin:#6d7a9c;
  --c-fertile:#5aa07d;--c-ovul:#2f8f63;
  --shadow:0 1px 2px rgba(40,34,24,.06),0 6px 20px rgba(40,34,24,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16140e;--surface:#201d15;--surface2:#2a261a;--ink:#ece6d8;--ink2:#a89e89;
  --line:#34301f;--accent:#d19b6c;--accent2:#8fae74;
  --t0:#2c3054;--t1:#414876;--t2:#5d66a6;--t3:#8992d4;--t4:#b3bbf0;
  --c-period:#d3665c; --moon-full:#e6cd83;--moon-shade:#b8a052;--moon-ring:#7d765b;--moon-dark:#12100b;
  --kevin:#d38f76;--hild:#93a35f;--berlin:#8894b8;
  --c-fertile:#74c09a;--c-ovul:#54c592;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}}
:root[data-theme="light"]{
  --bg:#f4f1e8;--surface:#fdfbf5;--surface2:#efeade;--ink:#2b2721;--ink2:#6d6557;--line:#e2dbca;--accent:#9c6b3f;--accent2:#5c7a4f;
  --t0:#e6eaf6;--t1:#bcc4ec;--t2:#8b95d8;--t3:#4a55ac;--t4:#262a63;
  --c-period:#c0574f;--moon-full:#e7d488;--moon-shade:#c9b45f;--moon-ring:#8a8262;--moon-dark:#312d22;
  --kevin:#c17a63;--hild:#7d8a4e;--berlin:#6d7a9c;--c-fertile:#5aa07d;--c-ovul:#2f8f63;--shadow:0 1px 2px rgba(40,34,24,.06),0 6px 20px rgba(40,34,24,.05);}
:root[data-theme="dark"]{
  --bg:#16140e;--surface:#201d15;--surface2:#2a261a;--ink:#ece6d8;--ink2:#a89e89;--line:#34301f;--accent:#d19b6c;--accent2:#8fae74;
  --t0:#2c3054;--t1:#414876;--t2:#5d66a6;--t3:#8992d4;--t4:#b3bbf0;
  --c-period:#d3665c;--moon-full:#e6cd83;--moon-shade:#b8a052;--moon-ring:#7d765b;--moon-dark:#12100b;
  --kevin:#d38f76;--hild:#93a35f;--berlin:#8894b8;--c-fertile:#74c09a;--c-ovul:#54c592;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,52px) clamp(16px,4vw,40px) 70px}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.top{position:relative;display:flex;justify-content:center;text-align:center;padding-top:4px}
.headmid{max-width:640px}
.headbtns{position:absolute;top:0;right:0;display:flex;gap:8px}
h1{font-size:clamp(40px,7vw,66px);line-height:1;letter-spacing:.06em;margin-top:14px}
.headmid{display:flex;flex-direction:column;align-items:center}
.headicon-wrap{position:relative;width:88px;height:88px;border-radius:50%;overflow:hidden;box-shadow:0 4px 16px rgba(40,34,24,.18);cursor:pointer}
.headicon{width:100%;height:100%;display:block;object-fit:cover}
.headicon-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-160%);animation:hshimmer 7s ease-in-out infinite;pointer-events:none}
@keyframes hshimmer{0%{transform:translateX(-160%)}10%{transform:translateX(160%)}100%{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){.headicon-wrap::after{animation:none}}
.sub{color:var(--ink2);max-width:58ch;margin:12px auto 0;font-size:15px;font-family:var(--serif)}
.sub i{color:var(--ink)}
.subattr{display:block;font-family:var(--sans);font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-top:7px}
.themebtn{font-size:15px;line-height:1;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--accent)}
section.block{margin-top:40px}
.blockhead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin-bottom:6px}
.blockhead h2{font-size:22px}
.blockhead p{margin:0;color:var(--ink2);font-size:13.5px;max-width:52ch}
/* crossing + floating row */
.toprow{display:grid;grid-template-columns:0.8fr 1.2fr;gap:22px;margin-top:0;align-items:stretch}
.tcolm{display:flex;flex-direction:column}
.tcolm .blockhead{margin-bottom:12px}
.tcolm .crossing,.tcolm .floatcard{flex:1;margin-top:0}
.cshore{display:block;margin-top:2px}
.tidequote{margin:12px 2px 0;font-family:var(--serif);font-size:14.5px;color:var(--ink2);max-width:66ch}
.tidequote i{color:var(--ink)}
.tidequote span{display:block;font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.blockhead p{max-width:66ch}
.refbtn{font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;margin-left:8px}
.refbtn:hover{color:var(--ink);border-color:var(--accent)}
.headbtns{display:flex;gap:0}
.ftask.done{display:none}
.floatwrap.showdone .ftask.done{display:flex;opacity:1;background:color-mix(in srgb,var(--accent2) 11%,var(--surface2));border-color:color-mix(in srgb,var(--accent2) 38%,var(--line))}
.ftask.done .ftext{text-decoration:line-through;text-decoration-color:var(--ink2);opacity:.6}
.ftask.done .fdrops{opacity:.35}
.ftask.done .fdate{opacity:.5}
.fresolvedrow{display:flex;justify-content:center;margin-top:6px}
.fresolved{font:inherit;font-size:11.5px;color:var(--ink2);background:none;border:none;cursor:pointer;padding:4px 8px;text-decoration:underline;text-underline-offset:2px}
.fresolved:hover{color:var(--accent)}
.fdone{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);background:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:700}
.fdone:hover{border-color:var(--accent2)}
.ftask.done .fdone{background:var(--accent2);border-color:var(--accent2);color:#fff}
.wk.min .chips{display:none}
.wkhead{cursor:pointer;user-select:none}
.wkhead .caret{font-size:11px;color:var(--ink2);transition:transform .15s}
.wk.min .caret{transform:rotate(-90deg)}
.crossing{display:flex;gap:20px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.glass{position:relative;width:78px;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);flex:none}
.glass .water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,color-mix(in srgb,var(--t3) 90%,transparent),var(--t4));transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.glass .water::before{content:"";position:absolute;left:-10%;right:-10%;top:-7px;height:13px;border-radius:50%;background:var(--t2)}
.ctext{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
.cbig{font-family:var(--serif);font-size:34px;line-height:1}
.cbig span{color:var(--ink2);font-size:19px}
.cmsg{font-family:var(--serif);font-size:18px;line-height:1.3;text-wrap:balance}
.csub{font-size:12.5px;color:var(--ink2)}
.floatcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column}
.floatcard h3{font-size:15px}
.floatcard .fp{font-size:12px;color:var(--ink2);margin:3px 0 12px}
.floatwrap{display:flex;flex-direction:column;gap:8px}
.ftask{display:flex;align-items:center;gap:11px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:grab;transition:box-shadow .15s,transform .15s}
.ftask:hover{box-shadow:var(--shadow)}
.ftask.dragging{opacity:.5}
.ftask.anchored{opacity:.65;cursor:default}
.fdrops{display:inline-flex;gap:3px;flex:none}
.fdrops i{width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block;background:var(--fc)}
.ftask.e-light{--fc:#8bbcd6}.ftask.e-medium{--fc:#5560b4}.ftask.e-heavy{--fc:#262a63}
.ftext{font-size:13px;flex:1}
.fdate{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.fanchor{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;cursor:pointer;background:none;flex:none}
.fanchor:hover{border-color:var(--accent);color:var(--accent)}
.fempty{font-size:12px;color:var(--ink2);padding:8px 0}
.fdate{font-size:11px;color:var(--ink2);font-weight:600;flex:none;letter-spacing:.01em}
.floatadd{display:flex;gap:7px;align-items:stretch;margin-top:11px}
.floatadd input{flex:1;min-width:0;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.floatadd input:focus{outline:none;border-color:var(--accent)}
.fteff{border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;padding:0 11px;display:flex;align-items:center;flex:none}
.fteff:hover{border-color:var(--accent)}
.fteff.e-light{--fc:#8bbcd6}.fteff.e-medium{--fc:#5560b4}.fteff.e-heavy{--fc:#262a63}
.ftaddbtn{font:inherit;font-weight:600;font-size:13px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 15px;cursor:pointer;flex:none}
.ftaddbtn:hover{filter:brightness(1.05)}
.ftask .fdel{font-size:14px;line-height:1;color:var(--ink2);border:none;background:none;cursor:pointer;flex:none;opacity:.45;padding:0 1px}
.ftask .fdel:hover{opacity:1;color:#c0574f}
.ftask.dragover{box-shadow:0 -2px 0 var(--accent)}
.ftask.hasdraft{flex-wrap:wrap}
.fdraftbtn{font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:7px;padding:3px 9px;cursor:pointer;background:none;flex:none;font-weight:600}
.fdraftbtn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ftask.dopen .fdraftbtn{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.fdraftpanel{flex-basis:100%;width:100%;margin-top:9px;border-top:1px dashed var(--line);padding-top:10px;cursor:default}
.fnote{font-size:12px;color:var(--ink2);line-height:1.45;margin-bottom:9px;font-style:italic}
.fdrafttop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px}
.fdlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700}
.fcopy{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:7px;padding:4px 13px;cursor:pointer;flex:none}
.fcopy:hover{filter:brightness(1.05)}
.fdraftpre{white-space:pre-wrap;word-wrap:break-word;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:0;max-height:340px;overflow:auto;-webkit-user-select:text;user-select:text}
/* tide */
.tidecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px 16px;margin-top:16px}
.tidescroll{overflow-x:auto}
.tide{display:flex;gap:6px;min-width:660px;align-items:flex-end}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:36px}
.moons{height:16px;display:flex;gap:2px;align-items:center;justify-content:center}
.moon{width:13px;height:13px;border-radius:50%}
.moon.full{background:radial-gradient(circle at 37% 33%,#fbf1c8,var(--moon-full) 62%,var(--moon-shade) 100%);box-shadow:0 0 8px 1px color-mix(in srgb,var(--moon-full) 60%,transparent)}
.moon.new{background:radial-gradient(circle at 40% 36%,#4b4636,var(--moon-dark) 75%);border:1px solid var(--moon-ring)}
.bar-wrap{height:118px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:76%;max-width:30px;border-radius:5px 5px 3px 3px;position:relative;transition:height .8s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:center;min-height:8px}
.bar.l0{background:var(--t0)}.bar.l1{background:var(--t1)}.bar.l2{background:var(--t2)}.bar.l3{background:var(--t3)}.bar.l4{background:var(--t4)}
.bv{position:absolute;top:-16px;font-size:10.5px;color:var(--ink2);font-weight:600}
.tname{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);text-align:center;min-height:12px;line-height:1.1}
.tcol[data-lvl="4"] .tname,.tcol[data-lvl="3"] .tname{color:var(--accent);font-weight:700}
.cyrow{display:flex;gap:1px;width:82%;height:6px}
.cyd{flex:1;border-radius:2px;background:var(--surface2)}
.cyd.c-period{background:var(--c-period)}
.cyd.c-fertile{background:var(--c-fertile)}
.cyd.c-ovul{background:var(--c-ovul);box-shadow:0 0 0 1px var(--surface),0 0 4px var(--c-ovul)}
.wlab{font-size:9.5px;color:var(--ink2)}
.tcol.tnow .wlab{color:var(--accent);font-weight:700}
.tcol.tnow .wlab::before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 auto 3px}
.tidekey{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.tidekey b{color:var(--ink);font-weight:600}
.kk{display:inline-flex;align-items:center;gap:7px}
.kk .d{width:11px;height:11px;border-radius:3px;display:inline-block}
/* daily */
.dailywrap{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 4px 12px}
.daily{display:flex;gap:5px;overflow-x:auto;padding:4px 14px 12px;scroll-snap-type:x proximity}
.dcol{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 3px 7px;border-radius:11px;scroll-snap-align:start}
.dcol.wknd{background:var(--surface2)}
.dcol.today{background:color-mix(in srgb,var(--accent) 13%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent)}
.dwd{font-size:10px;text-transform:uppercase;color:var(--ink2)}
.dnum{font-family:var(--serif);font-size:18px;line-height:1}
.dmoon{height:15px;display:flex;align-items:center}
.ddrop{width:7px;height:7px;border-radius:50%;background:var(--c-period)}.ddrop.blank{background:transparent}
.ddots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:9px;max-width:46px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.dot.big{width:11px;height:11px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.dot.done{background:color-mix(in srgb,var(--ink2) 42%,var(--surface))}
.dot.big.done{box-shadow:0 0 0 2px color-mix(in srgb,var(--ink2) 22%,transparent)}
.dtot{font-size:10px;color:var(--ink2);font-weight:700;min-height:12px}
.dmon{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.dhint{font-size:12.5px;color:var(--ink2);padding:2px 16px 0}
.dempty{padding:26px 16px;color:var(--ink2);font-size:14px}
/* courses + stats */
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.lg{flex:0 1 240px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:1px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;color:var(--ink);transition:opacity .2s,border-color .2s}
.lg .sw{grid-row:1/3;align-self:center;width:14px;height:14px;border-radius:5px;background:var(--cl)}
.lg .lgn{font-weight:600;font-size:14px}.lg .lgc{font-size:11px;color:var(--ink2);align-self:center}
.lg .lgx{grid-column:2/4;font-size:11.5px;color:var(--ink2)}
.lg:hover{border-color:var(--cl)}.lg.off{opacity:.34}
.stats{display:flex;flex-wrap:wrap;gap:22px 30px;margin-top:18px;padding:2px 4px;color:var(--ink2)}
.stat{display:flex;align-items:baseline;gap:8px;font-size:13px}
.stat b{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:600}
.stat.warm b{color:var(--accent)}
/* timeline */
.timeline{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.wk{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.wk.newmonth{margin-top:30px}
.montab{position:absolute;top:-21px;left:16px;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;padding:4px 15px 7px;font-family:var(--serif);font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--t3)}
.wk[data-lvl="4"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.wkhead h3{font-size:18px}
.wkmeta{display:flex;align-items:center;gap:10px}
.tidepill{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.tidepill.l0{background:var(--t1);color:var(--ink)}.tidepill.l1{background:var(--t2)}.tidepill.l2{background:var(--t2)}.tidepill.l3{background:var(--t3)}.tidepill.l4{background:var(--t4)}
.tidepill.donetag{background:color-mix(in srgb,var(--t3) 45%,var(--ink2) 55%);color:#fff}
.weekdone .wkhead h3,.weekdone .wkpts{opacity:.55}
.wkpts{font-size:13px;color:var(--ink2);font-weight:600}
/* per-week progress: how much of the week's work is cleared (2026-09-22) */
.wkprog{display:inline-flex;align-items:center;gap:7px}
.wkbar{display:inline-block;width:66px;height:6px;border-radius:999px;background:color-mix(in srgb,#2f8f8a 16%,var(--surface2));overflow:hidden;flex:none}
.wkbar i{display:block;height:100%;border-radius:999px;background:#2f8f8a;transition:width .35s ease}
.wkcount{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.weekdone .wkprog{opacity:.55}
@media(max-width:560px){.wkbar{width:42px}.wkcount{font-size:11px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--cl);border-radius:9px;padding:0 11px;height:40px;overflow:hidden;transition:transform .15s,box-shadow .15s,opacity .2s}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.chip .ctype{flex:none;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 5px;white-space:nowrap}
.chip .ccourse{flex:none;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--cl);background:color-mix(in srgb,var(--cl) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--cl) 34%,var(--line));border-radius:5px;padding:2px 6px;white-space:nowrap}
.chip.s-lg .ctype,.chip.s-xl .ctype{color:var(--cl);border-color:color-mix(in srgb,var(--cl) 40%,var(--line))}
.chip .exicon{flex:none;color:var(--ink2);opacity:.5;vertical-align:middle}
.chip.done{opacity:.45;filter:grayscale(.6)}
.chip.done .ctext{text-decoration:line-through;text-decoration-color:var(--ink2)}
.chiptip{position:fixed;z-index:120;pointer-events:none;max-width:250px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px 11px;font-size:12px;line-height:1.35;opacity:0;transform:translateY(3px);transition:opacity .12s ease,transform .12s ease}
.chiptip.show{opacity:1;transform:translateY(0)}
.chip[data-tip]{cursor:default}
.chip.meet{cursor:pointer}
.chip.meet .ct-meet{background:color-mix(in srgb,#7a6cd6 20%,transparent);color:#6a5cc6}
.chip.meet .meetdue{font-size:9.5px;opacity:.8;letter-spacing:.01em}
.meetpop{position:fixed;z-index:130;max-width:272px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:13px 15px;opacity:0;transform:translateY(4px);transition:opacity .13s ease,transform .13s ease;pointer-events:none}
.meetpop.show{opacity:1;transform:translateY(0);pointer-events:auto}
.meetpop .mpt{font-family:var(--serif);font-size:15px;line-height:1.25;margin-bottom:2px}
.meetpop .mpwho{font-size:12.5px;color:var(--ink2);margin-bottom:9px}
.meetpop .mpwhen{font-size:11px;color:var(--ink2);margin-bottom:11px;letter-spacing:.01em}
.meetpop .mpjoin{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:#fff;background:#5b4fc4;border-radius:999px;padding:7px 16px;text-decoration:none;transition:filter .15s}
.meetpop .mpjoin:hover{filter:brightness(1.08)}
.meetpop .mpmeta{font-size:11px;color:var(--ink2);margin-top:10px;line-height:1.6;user-select:all}
.chip .ctext{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cmeta{flex:none;margin-left:auto;display:flex;align-items:center;gap:9px}
.chip .cdue{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .cpts{font-size:12px;font-weight:700;color:var(--cl);min-width:18px;text-align:right}
.star{position:absolute;top:3px;right:7px;font-size:9px;color:var(--accent);line-height:1}
.chip.s-lg .ctext{font-weight:600}
.chip.s-xl{border-left-width:5px;background:color-mix(in srgb,var(--cl) 9%,var(--surface2));border-color:color-mix(in srgb,var(--cl) 30%,var(--line));box-shadow:var(--shadow)}
.chip.s-xl .ctext{font-weight:700}
.chip.hide{display:none}
.wmon{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;min-height:11px}
.wthx{font-size:8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}
.thxnote{font-size:13px;color:var(--ink2);font-style:italic;padding:4px 2px}
/* rhythm: cycle + beloved */
.rhythm{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.rgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:30px}
.rsub{font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-family:var(--sans);font-weight:600}
.cyctable{width:100%;border-collapse:collapse;font-size:13px}
.cyctable th{text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);padding:5px 12px 5px 0;border-bottom:1px solid var(--line)}
.cyctable td{padding:6px 12px 6px 0;border-bottom:1px solid var(--line)}
.cyctable tr.past{opacity:.42}
.cyctable tr.next td:first-child{font-weight:700;color:var(--accent)}
.cyctable td.fert{color:var(--c-fertile);font-weight:600}
.cyctable td .cmoon{display:inline-flex;vertical-align:middle;margin-left:7px}
.cyctable td .cmoon .moonic{vertical-align:middle;filter:drop-shadow(0 0 3px rgba(220,210,160,.35))}
.cycest{margin-top:9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);opacity:.65}
.cyctable td.ovul{color:var(--c-ovul);font-weight:700}
.cyctable td.mooncell{text-align:center;padding-right:6px}
.moonnext{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.orb .orbshade{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}
.cyctable td.mooncell .moonic{vertical-align:middle;filter:drop-shadow(0 0 3px rgba(220,210,160,.35))}
.cyctable th.moonh{color:var(--ink2);text-align:center;padding-right:6px}
/* beloved / with kevin: eclipse figures + drag calendars */
.beloved{position:relative}
.beloved .rsub{text-align:center;justify-content:center}
.figs{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:150px;max-width:430px;margin:6px auto 38px}
.figs img{height:112px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));position:relative;z-index:2;transition:transform 1.1s cubic-bezier(.55,.06,.2,1),filter .7s}
.figs.apart .figk{transform:translateX(-60px)}
.figs.apart .figm{transform:translateX(60px)}
.figs.together .figk{transform:translateX(16px)}
.figs.together .figm{transform:translateX(-16px)}
/* the celestial orb behind the two of you */
.orb{position:absolute;left:50%;top:48%;width:132px;height:132px;border-radius:50%;transform:translate(-50%,-50%);z-index:1;transition:opacity 1s ease,box-shadow 1s ease,background 1s ease,transform 1.1s cubic-bezier(.55,.06,.2,1)}
.figs.apart .orb{opacity:.96;transform:translate(-50%,-50%) scale(1)}
.figs.together .orb{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
.figs.together.orb-sun .orb{box-shadow:0 0 70px 22px rgba(242,192,92,.6),0 0 130px 54px rgba(242,192,92,.3)}
.orb-sun .orb{background:radial-gradient(circle at 45% 40%,#fff0c2,#f6cd6b 48%,#e9a63f 100%);box-shadow:0 0 55px 16px rgba(242,192,92,.5),0 0 110px 44px rgba(242,192,92,.22)}
.orb-moon .orb{background:radial-gradient(circle at 42% 38%,#f2ead2 0 6%,#d9cea6 42%,#bcb086 100%),radial-gradient(circle at 62% 60%,rgba(120,110,80,.5) 0 7px,transparent 8px),radial-gradient(circle at 34% 64%,rgba(120,110,80,.4) 0 5px,transparent 6px),radial-gradient(circle at 66% 32%,rgba(120,110,80,.35) 0 4px,transparent 5px);box-shadow:0 0 40px 12px rgba(220,208,160,.4),inset -7px -7px 18px rgba(120,110,80,.35)}
.orb-darkmoon .orb{background:radial-gradient(circle at 30% 30%,rgba(200,195,230,.18) 0 5px,transparent 6px),radial-gradient(circle at 62% 55%,rgba(0,0,0,.55) 0 10px,transparent 11px),radial-gradient(circle at 45% 70%,rgba(0,0,0,.45) 0 7px,transparent 8px),radial-gradient(circle at 70% 33%,rgba(0,0,0,.4) 0 5px,transparent 6px),radial-gradient(circle at 44% 42%,#443f5e,#26223a 62%,#171327 100%);box-shadow:0 0 46px 14px rgba(120,110,170,.4),inset -8px -8px 22px rgba(0,0,0,.55)}
.figcap{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
.kevrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 12px}
.kevcount{font-size:13px;color:var(--ink2)}
.kevcount b{color:var(--ink);font-family:var(--serif);font-size:18px}
.kevlock{display:inline-flex;align-items:center;background:none;border:none;padding:2px;color:var(--ink2);opacity:.7;cursor:pointer;transition:opacity .15s,color .15s,transform .2s}
.kevlock[hidden]{display:none}
.kevlock:hover{opacity:1;color:var(--kevin);transform:translateY(-1px)}
.kevlock svg{flex:none}
.kevcals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,230px));justify-content:center;gap:16px;-webkit-user-select:none;user-select:none;touch-action:none}
.kevnext{display:block;margin:12px auto 0;background:none;border:none;padding:2px 0;font-size:11.5px;font-weight:600;color:var(--kevin);opacity:.85;cursor:pointer}
.kevnext:hover{opacity:1;text-decoration:underline}
.kcal{min-width:0}
.kcal-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:5px}
.kcal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);gap:3px}
.kcal-wd{font-size:8.5px;text-align:center;color:var(--ink2);opacity:.65;padding-bottom:1px}
.kday{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:6px;background:var(--surface2);color:var(--ink2);cursor:pointer;border:1px solid transparent;transition:background .1s}
.kday.blank{background:transparent;cursor:default}
.kday.on{background:var(--kevin);color:#fff;border-color:var(--kevin)}
.kday.locked{cursor:default;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.kday.on.ulock{background:color-mix(in srgb,var(--kevin) 48%,var(--moon-full) 52%);border-color:color-mix(in srgb,var(--kevin) 40%,var(--moon-full) 60%);color:#2c2114;cursor:pointer}
.kday.on.ulock .pd{box-shadow:none}
.kday.today{border-color:var(--accent);font-weight:700}
.kday .pd{position:absolute;bottom:2px;right:2px;width:4px;height:4px;border-radius:50%;background:transparent}
.kday.p-period .pd{background:var(--c-period)}
.kday.p-fertile .pd{background:var(--c-fertile)}
.kday.p-ovul .pd{background:var(--c-ovul);box-shadow:0 0 3px var(--c-ovul)}
.kday.on .pd{box-shadow:0 0 0 1.5px var(--kevin)}
.kevnote{margin:14px auto 0;max-width:460px;text-align:center;font-size:12px;color:var(--ink2)}
/* live sessions */
.livedetails{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 4px}
.livesummary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:14px 18px}
.livesummary::-webkit-details-marker{display:none}
.livesummary::after{content:"\203A";margin-left:auto;color:var(--ink2);font-size:20px;transform:rotate(90deg);transition:transform .2s}
.livedetails[open] .livesummary::after{transform:rotate(-90deg)}
.livesumh{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.livesump{font-size:12.5px;color:var(--ink2)}
.liveintro{margin:0 18px 12px;font-size:13px;color:var(--ink2)}
.livedetails .livegrid{padding:0 14px 14px}
.liverow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:0 0 14px}
.liverowlab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700}
.livechip{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;white-space:nowrap}
a.livechip:hover{border-color:var(--accent)}
.liveon{width:9px;height:9px;border-radius:50%;background:var(--t3);flex:none}
.livegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px}
.livecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.livecard.late{border-color:color-mix(in srgb,var(--t3) 45%,var(--line))}
.livecard.exc{border-style:dashed;background:none}
.livehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.livecourse{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink)}
.livekind{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink2)}
.livetime{font-size:13px;color:var(--ink)}
.liveberlin{color:var(--ink2)}
.livelate{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--t3);white-space:nowrap}
.livetitle{font-size:14px;font-weight:600;color:var(--ink)}
.livenote{font-size:12.5px;color:var(--ink2);line-height:1.4}
.liveact{margin-top:2px}
.livezoom{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:#fff;background:var(--t3);border-radius:999px;padding:6px 14px;text-decoration:none;transition:filter .15s}
.livezoom:hover{filter:brightness(1.08)}
.livezoomnote{font-size:12px;color:var(--ink2);font-style:italic}
/* whereabouts (just where I am now + next trip) - sits under the cycle table */
.whereabouts{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.whereabouts .rsub{justify-content:center;text-align:center}
.wcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.wcur-lab{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}
.wcur{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:27px;line-height:1.1;color:var(--ink);margin-top:2px}
.wcur .wdot{width:11px;height:11px;border-radius:50%;background:var(--wc,#7fa88f);box-shadow:0 0 0 4px color-mix(in srgb,var(--wc,#7fa88f) 25%,transparent);flex:none}
.wcur .wk-heart{color:#d9738a;font-size:15px}
.wuntil{font-size:12px;color:var(--ink2)}
.wnext{margin-top:12px;font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 15px;cursor:default}
.wnext b{color:var(--ink);font-weight:600}
.wnext[data-tip]{cursor:help}
/* building the platform (growing orb of tide rings) */
.platform-wrap{display:flex;gap:32px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 28px}
.porb{position:relative;flex:none;width:264px;height:264px;margin:0 auto}
.porb svg{display:block;width:100%;height:100%;overflow:visible}
.porb-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.porb-pct{font-family:var(--serif);font-size:42px;line-height:1;color:var(--ink)}
.porb-lab{font-size:10.5px;color:var(--ink2);max-width:124px;margin-top:5px;line-height:1.3}
.pring{fill:none}
.pring.glow{stroke:var(--t3);stroke-width:12;stroke-opacity:.32;filter:url(#porbglow)}
.pring.done{stroke:var(--t4);stroke-width:7}
.pring.cur-glow{stroke:var(--t2);stroke-width:12;stroke-opacity:.4;filter:url(#porbglow);animation:porbpulse 2.8s ease-in-out infinite}
.pring.current{stroke:var(--t2);stroke-width:7;stroke-dasharray:2 6;stroke-linecap:round}
.pring.future{stroke:var(--t1);stroke-width:2;stroke-opacity:.55}
.porb-core{fill:var(--surface);stroke:var(--t1);stroke-width:1;stroke-opacity:.5}
.pflag{fill:var(--moon-full);stroke:var(--surface);stroke-width:1.5}
@keyframes porbpulse{0%,100%{stroke-opacity:.16;stroke-width:9}50%{stroke-opacity:.5;stroke-width:15}}
@media(prefers-reduced-motion:reduce){.pring.cur-glow{animation:none;stroke-opacity:.4}}
.plegend{flex:1;min-width:230px;display:flex;flex-direction:column;gap:0}
.pstage{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}
.pstage:last-child{border-bottom:none}
.pdot{flex:none;width:13px;height:13px;border-radius:50%;margin-top:3px}
.pdot.done{background:var(--t4);box-shadow:0 0 0 3px color-mix(in srgb,var(--t3) 32%,transparent)}
.pdot.current{background:var(--t2);box-shadow:0 0 0 3px color-mix(in srgb,var(--t2) 35%,transparent);animation:pdotpulse 2.8s ease-in-out infinite}
.pdot.future{background:transparent;border:1.5px solid var(--t1)}
@keyframes pdotpulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--t2) 32%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--t2) 10%,transparent)}}
@media(prefers-reduced-motion:reduce){.pdot.current{animation:none}}
.pstage-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.pstage-lab{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pstage-note{font-size:11.5px;color:var(--ink2);line-height:1.4}
.pm-badge{font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--moon-dark);background:var(--moon-full);border-radius:20px;padding:2px 9px;white-space:nowrap}
.pmile{display:flex;align-items:flex-start;gap:9px;padding:6px 0 8px 2px}
.pmile-flag{flex:none;color:var(--moon-full);font-size:14px;line-height:1.2;margin-top:1px}
.pmile-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.pmile-lab{font-size:12.5px;font-weight:600;color:var(--accent2)}
.pmile-hint{font-size:11px;color:var(--ink2);font-style:italic}
.pcap{font-size:11.5px;color:var(--ink2);font-style:italic;margin-top:12px;text-align:center}

.dashh{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 12px}
.dashgrid{display:flex;flex-direction:column;gap:12px}
.dashcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px}
.dashhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dashname{font-family:var(--serif);font-size:18px;color:var(--ink)}
.dashlinks{display:flex;gap:8px;flex-wrap:wrap}
.dashbarrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.dbar{flex:1;min-width:120px;height:7px;border-radius:7px;background:color-mix(in srgb,var(--t1) 35%,transparent);overflow:hidden}
.dbar span{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--t2),var(--t4))}
.dpct{font-size:12.5px;font-weight:700;color:var(--ink)}
.dashbarlab{font-size:11.5px;color:var(--ink2);width:100%}
.dashsteps{margin-top:8px}
.dashsteps>summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none;padding:4px 0}
.dashsteps>summary::-webkit-details-marker{display:none}
.dashsteps>summary::before{content:"\25B8  "}
.dashsteps[open]>summary::before{content:"\25BE  "}
.dashsteps .platform-wrap{margin-top:8px;box-shadow:none}
@media(max-width:560px){.platform-wrap{flex-direction:column;gap:18px;padding:20px 18px}.porb{width:220px;height:220px}}
/* scholarships (collapsed section) */
.schodetails{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.schosummary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.schosummary::-webkit-details-marker{display:none}
.schoh{font-family:var(--serif);font-size:20px;color:var(--ink)}
.schosub{font-size:12.5px;color:var(--ink2)}
.schodetails[open] .scholist{margin-top:16px}
.scholist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 12px;align-items:start}
.scho{position:relative;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:0}
.schotab{position:absolute;top:-13px;left:12px;z-index:1;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:2px 11px 4px;font-family:var(--serif);font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.03em}
.schosum{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px 12px}
.schosum::-webkit-details-marker{display:none}
.schosum::after{content:"\203A";color:var(--ink2);font-size:18px;transform:rotate(90deg);transition:transform .2s;flex:none}
.scho[open] .schosum::after{transform:rotate(-90deg)}
.schotitle{display:flex;flex-direction:column;gap:3px;min-width:0}
.schoname{font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.3}
.schowhen{font-size:11.5px;color:var(--accent);font-weight:600}

function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryUnlock(pw,remember){
  try{
    const key=await deriveKey(pw,b64d(ENC.s));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.i)},key,b64d(ENC.c));
    const payload=JSON.parse(new TextDecoder().decode(pt));
    if(remember){try{localStorage.setItem('marea_pw',pw);}catch(e){}}
    render(payload); return true;
  }catch(e){return false;}
}

  (function(){
    var sc=document.querySelector('.tidescroll'); if(!sc) return;
    var tide=sc.querySelector('.tide');
    var wkMon=addDays(today,-((today.getDay()+6)%7)); // this week's Monday
    var cutoff=iso(wkMon);
    var cols=[].slice.call(sc.querySelectorAll('.tcol[data-mon]'));
    var shown=0, first=null;
    cols.forEach(function(c){
      if(c.getAttribute('data-mon') < cutoff){ c.style.display='none'; } // a passed week: drop it
      else { shown++; if(!first) first=c; }
    });
    if(first) first.classList.add('tnow'); // mark the current week (now the leading bar)
    // shrink the strip's min-width to what remains, so the fewer weeks left, the more each breathes
    if(tide && shown){ tide.style.minWidth = Math.max(300, shown*44) + 'px'; }
    sc.scrollLeft = 0;
  })();
  // MULI: show a "call today" reminder on the collapsed row on Mondays and Tuesdays only
  (function(){ var wd=today.getDay(); if(wd===1||wd===2){ var mt=document.getElementById('mulitoday'); if(mt) mt.hidden=false; } })();
  // Scholarships: shimmering "coming up" on any due within the next 3 weeks
  (function(){ document.querySelectorAll('.scho[data-due]').forEach(function(el){ var dv=el.getAttribute('data-due'); if(!dv) return; var due=new Date(dv+'T23:59:59'); var days=Math.ceil((due-today)/DAY); if(days>=0 && days<=21){ var b=el.querySelector('.schocoming'); if(b) b.hidden=false; } }); })();
  // Scholarships: filter by effort and reward level (all / low / med / high on each)
  (function(){ var list=document.querySelector('.scholist'); if(!list) return; var btns=document.querySelectorAll('.schoctl .sfb'); if(!btns.length) return;
    var state={effort:0,reward:0};
    function apply(){ list.querySelectorAll('.scho').forEach(function(c){
      var e=+c.getAttribute('data-effort'), r=+c.getAttribute('data-reward');
      var ok=(state.effort===0||e===state.effort)&&(state.reward===0||r===state.reward);
      c.style.display=ok?'':'none'; }); }
    btns.forEach(function(bt){ bt.addEventListener('click',function(){
      var dim=bt.getAttribute('data-dim'), val=+bt.getAttribute('data-val'); state[dim]=val;
      document.querySelectorAll('.schoctl .sfb[data-dim="'+dim+'"]').forEach(function(x){x.classList.remove('active');});
      bt.classList.add('active'); apply(); }); });
  })();
  // ---- sand (light) / galactic dust (dark), the fist that slips sand ----
  (function(){
    var cv=document.getElementById('sand'); if(!cv||!cv.getContext) return;
    var ctx=cv.getContext('2d'), W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches, raf=0;
    function dark(){var t=document.documentElement.getAttribute('data-theme'); return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;}
    function rnd(a,b){return a+Math.random()*(b-a);}
    var fall=[], stars=[];
    function mk(top){return {x:rnd(0,W), y:top?rnd(-24,-2):rnd(0,H), v:rnd(0.3,1.15), s:rnd(0.6,1.5), dx:rnd(-0.14,0.14), c:Math.random(), ph:rnd(0,6.28)};}
    function duneY(x){return H-15-9*Math.sin(x/95)-5*Math.sin(x/36+1.3);}
    function resize(){
      W=cv.clientWidth||600; H=cv.clientHeight||150; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
      fall=[]; for(var i=0;i<Math.round(W/7);i++)fall.push(mk(false));
      stars=[]; for(var j=0;j<Math.round(W/9);j++)stars.push({x:rnd(0,W),y:rnd(0,H*0.72),r:rnd(0.4,1.5),tw:rnd(0,6.28),tv:rnd(0.008,0.03),c:Math.random()});
    }
    function frame(){
      var d=dark(); ctx.clearRect(0,0,W,H);
      var g=ctx.createLinearGradient(0,0,0,H);
      if(d){g.addColorStop(0,'rgba(20,17,34,0)');g.addColorStop(.55,'rgba(28,23,52,0.35)');g.addColorStop(1,'rgba(46,38,86,0.65)');}
      else{g.addColorStop(0,'rgba(236,224,196,0)');g.addColorStop(.55,'rgba(224,208,168,0.32)');g.addColorStop(1,'rgba(203,182,134,0.62)');}
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      if(d){for(var si=0;si<stars.length;si++){var s=stars[si]; s.tw+=s.tv; var a=(0.35+0.6*Math.abs(Math.sin(s.tw))).toFixed(2); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fillStyle=(s.c<0.85?'rgba(214,222,248,':(s.c<0.95?'rgba(150,180,240,':'rgba(240,214,150,'))+a+')'; ctx.fill();}}
      ctx.beginPath(); ctx.moveTo(0,H); for(var x=0;x<=W;x+=6)ctx.lineTo(x,duneY(x)); ctx.lineTo(W,H); ctx.closePath();
      var dg=ctx.createLinearGradient(0,H-34,0,H);
      if(d){dg.addColorStop(0,'#37306a');dg.addColorStop(1,'#100d20');} else {dg.addColorStop(0,'#e4d2a4');dg.addColorStop(1,'#c1aa76');}
      ctx.fillStyle=dg; ctx.fill();
      for(var k=0;k<W/3;k++){var gx=rnd(0,W),gy=rnd(duneY(gx),H); ctx.fillStyle=d?'rgba(185,180,235,'+rnd(0.05,0.22).toFixed(2)+')':'rgba(120,95,55,'+rnd(0.05,0.2).toFixed(2)+')'; ctx.fillRect(gx,gy,1,1);}
      for(var fi=0;fi<fall.length;fi++){var p=fall[fi]; var col; if(d){col=p.c<0.72?'rgba(222,228,248,':(p.c<0.9?'rgba(150,182,242,':'rgba(242,216,150,');} else {col='rgba('+((212-p.c*46)|0)+','+((188-p.c*44)|0)+','+((142-p.c*42)|0)+',';} var al=(0.45+0.4*Math.abs(Math.sin(p.ph+p.y*0.04))).toFixed(2); ctx.fillStyle=col+al+')'; ctx.fillRect(p.x,p.y,p.s,p.s); if(!reduce){p.y+=p.v; p.x+=p.dx;} if(p.y>duneY(p.x)-1){var nn=mk(true); p.x=nn.x;p.y=nn.y;p.v=nn.v;p.s=nn.s;p.dx=nn.dx;p.c=nn.c;p.ph=nn.ph;}}
      if(!reduce) raf=requestAnimationFrame(frame);
    }
    function start(){cancelAnimationFrame(raf); resize(); frame();}
    start();
    var rt; window.addEventListener('resize',function(){clearTimeout(rt); rt=setTimeout(start,150);});
    new MutationObserver(function(){ if(reduce) frame(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  })();

}
(function(){
  var g=document.getElementById('gate');
  var saved=null; try{saved=localStorage.getItem('marea_pw');}catch(e){}
  function showGate(){
    g.innerHTML='<div class="gatecard"><div class="gt">Marea</div><div class="gs">Your tide. Enter your password to open.</div><input id="gpw" type="password" placeholder="password" autocomplete="current-password"><label class="grem"><input type="checkbox" id="grem" checked> remember on this device</label><button id="gbtn">Open</button><div class="gerr" id="gerr"></div></div>';
    var inp=document.getElementById('gpw');
    function go(){var pw=inp.value; if(!pw)return; document.getElementById('gerr').textContent=''; tryUnlock(pw,document.getElementById('grem').checked).then(function(ok){if(!ok){document.getElementById('gerr').textContent='Wrong password.'; inp.value='';}});}
    document.getElementById('gbtn').addEventListener('click',go);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
    inp.focus();
  }
  if(saved){tryUnlock(saved,false).then(function(ok){if(!ok)showGate();});}
  else showGate();
})();
</script>
