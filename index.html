<title>Marea</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-drop3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marea">
<meta name="theme-color" content="#4a55ac">
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#f4f1e8; --surface:#fdfbf5; --surface2:#efeade; --ink:#2b2721; --ink2:#6d6557;
  --line:#e2dbca; --accent:#9c6b3f; --accent2:#5c7a4f;
  --t0:#e6eaf6;--t1:#bcc4ec;--t2:#8b95d8;--t3:#4a55ac;--t4:#262a63;
  --c-period:#c0574f; --moon-full:#e7d488;--moon-shade:#c9b45f;--moon-ring:#8a8262;--moon-dark:#312d22;
  --kevin:#c17a63; --hild:#7d8a4e; --berlin:#6d7a9c;
  --c-fertile:#5aa07d;--c-ovul:#2f8f63;
  --shadow:0 1px 2px rgba(40,34,24,.06),0 6px 20px rgba(40,34,24,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16140e;--surface:#201d15;--surface2:#2a261a;--ink:#ece6d8;--ink2:#a89e89;
  --line:#34301f;--accent:#d19b6c;--accent2:#8fae74;
  --t0:#2c3054;--t1:#414876;--t2:#5d66a6;--t3:#8992d4;--t4:#b3bbf0;
  --c-period:#d3665c; --moon-full:#e6cd83;--moon-shade:#b8a052;--moon-ring:#7d765b;--moon-dark:#12100b;
  --kevin:#d38f76;--hild:#93a35f;--berlin:#8894b8;
  --c-fertile:#74c09a;--c-ovul:#54c592;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}}
:root[data-theme="light"]{
  --bg:#f4f1e8;--surface:#fdfbf5;--surface2:#efeade;--ink:#2b2721;--ink2:#6d6557;--line:#e2dbca;--accent:#9c6b3f;--accent2:#5c7a4f;
  --t0:#e6eaf6;--t1:#bcc4ec;--t2:#8b95d8;--t3:#4a55ac;--t4:#262a63;
  --c-period:#c0574f;--moon-full:#e7d488;--moon-shade:#c9b45f;--moon-ring:#8a8262;--moon-dark:#312d22;
  --kevin:#c17a63;--hild:#7d8a4e;--berlin:#6d7a9c;--c-fertile:#5aa07d;--c-ovul:#2f8f63;--shadow:0 1px 2px rgba(40,34,24,.06),0 6px 20px rgba(40,34,24,.05);}
:root[data-theme="dark"]{
  --bg:#16140e;--surface:#201d15;--surface2:#2a261a;--ink:#ece6d8;--ink2:#a89e89;--line:#34301f;--accent:#d19b6c;--accent2:#8fae74;
  --t0:#2c3054;--t1:#414876;--t2:#5d66a6;--t3:#8992d4;--t4:#b3bbf0;
  --c-period:#d3665c;--moon-full:#e6cd83;--moon-shade:#b8a052;--moon-ring:#7d765b;--moon-dark:#12100b;
  --kevin:#d38f76;--hild:#93a35f;--berlin:#8894b8;--c-fertile:#74c09a;--c-ovul:#54c592;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,52px) clamp(16px,4vw,40px) 70px}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.top{position:relative;display:flex;justify-content:center;text-align:center;padding-top:4px}
.headmid{max-width:640px}
.headbtns{position:absolute;top:0;right:0;display:flex;gap:8px}
h1{font-size:clamp(40px,7vw,66px);line-height:1;letter-spacing:.06em;margin-top:14px}
.headmid{display:flex;flex-direction:column;align-items:center}
.headicon-wrap{position:relative;width:88px;height:88px;border-radius:50%;overflow:hidden;box-shadow:0 4px 16px rgba(40,34,24,.18);cursor:pointer}
.headicon{width:100%;height:100%;display:block;object-fit:cover}
.headicon-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-160%);animation:hshimmer 7s ease-in-out infinite;pointer-events:none}
@keyframes hshimmer{0%{transform:translateX(-160%)}10%{transform:translateX(160%)}100%{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){.headicon-wrap::after{animation:none}}
.sub{color:var(--ink2);max-width:58ch;margin:12px auto 0;font-size:15px;font-family:var(--serif)}
.sub i{color:var(--ink)}
.subattr{display:block;font-family:var(--sans);font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-top:7px}
.themebtn{font-size:15px;line-height:1;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--accent)}
section.block{margin-top:40px}
.blockhead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin-bottom:6px}
.blockhead h2{font-size:22px}
.blockhead p{margin:0;color:var(--ink2);font-size:13.5px;max-width:52ch}
/* crossing + floating row */
.toprow{display:grid;grid-template-columns:0.8fr 1.2fr;gap:22px;margin-top:0;align-items:stretch}
.tcolm{display:flex;flex-direction:column}
.tcolm .blockhead{margin-bottom:12px}
.tcolm .crossing,.tcolm .floatcard{flex:1;margin-top:0}
.cshore{display:block;margin-top:2px}
.tidequote{margin:12px 2px 0;font-family:var(--serif);font-size:14.5px;color:var(--ink2);max-width:66ch}
.tidequote i{color:var(--ink)}
.tidequote span{display:block;font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.blockhead p{max-width:66ch}
.refbtn{font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;margin-left:8px}
.refbtn:hover{color:var(--ink);border-color:var(--accent)}
.headbtns{display:flex;gap:0}
.ftask.done{display:none}
.floatwrap.showdone .ftask.done{display:flex;opacity:1;background:color-mix(in srgb,var(--accent2) 11%,var(--surface2));border-color:color-mix(in srgb,var(--accent2) 38%,var(--line))}
.ftask.done .ftext{text-decoration:line-through;text-decoration-color:var(--ink2);opacity:.6}
.ftask.done .fdrops{opacity:.35}
.ftask.done .fdate{opacity:.5}
.fresolvedrow{display:flex;justify-content:center;margin-top:6px}
.fresolved{font:inherit;font-size:11.5px;color:var(--ink2);background:none;border:none;cursor:pointer;padding:4px 8px;text-decoration:underline;text-underline-offset:2px}
.fresolved:hover{color:var(--accent)}
.fdone{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);background:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:700}
.fdone:hover{border-color:var(--accent2)}
.ftask.done .fdone{background:var(--accent2);border-color:var(--accent2);color:#fff}
.wk.min .chips{display:none}
.wkhead{cursor:pointer;user-select:none}
.wkhead .caret{font-size:11px;color:var(--ink2);transition:transform .15s}
.wk.min .caret{transform:rotate(-90deg)}
.crossing{display:flex;gap:20px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.glass{position:relative;width:78px;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);flex:none}
.glass .water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,color-mix(in srgb,var(--t3) 90%,transparent),var(--t4));transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.glass .water::before{content:"";position:absolute;left:-10%;right:-10%;top:-7px;height:13px;border-radius:50%;background:var(--t2)}
.ctext{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
.cbig{font-family:var(--serif);font-size:34px;line-height:1}
.cbig span{color:var(--ink2);font-size:19px}
.cmsg{font-family:var(--serif);font-size:18px;line-height:1.3;text-wrap:balance}
.csub{font-size:12.5px;color:var(--ink2)}
.floatcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column}
.floatcard h3{font-size:15px}
.floatcard .fp{font-size:12px;color:var(--ink2);margin:3px 0 12px}
.floatwrap{display:flex;flex-direction:column;gap:8px}
.ftask{display:flex;align-items:center;gap:11px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:grab;transition:box-shadow .15s,transform .15s}
.ftask:hover{box-shadow:var(--shadow)}
.ftask.dragging{opacity:.5}
.ftask.anchored{opacity:.65;cursor:default}
.fdrops{display:inline-flex;gap:3px;flex:none}
.fdrops i{width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block;background:var(--fc)}
.ftask.e-light{--fc:#8bbcd6}.ftask.e-medium{--fc:#5560b4}.ftask.e-heavy{--fc:#262a63}
.ftext{font-size:13px;flex:1}
.fdate{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.fanchor{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;cursor:pointer;background:none;flex:none}
.fanchor:hover{border-color:var(--accent);color:var(--accent)}
.fempty{font-size:12px;color:var(--ink2);padding:8px 0}
.fdate{font-size:11px;color:var(--ink2);font-weight:600;flex:none;letter-spacing:.01em}
.floatadd{display:flex;gap:7px;align-items:stretch;margin-top:11px}
.floatadd input{flex:1;min-width:0;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.floatadd input:focus{outline:none;border-color:var(--accent)}
.fteff{border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;padding:0 11px;display:flex;align-items:center;flex:none}
.fteff:hover{border-color:var(--accent)}
.fteff.e-light{--fc:#8bbcd6}.fteff.e-medium{--fc:#5560b4}.fteff.e-heavy{--fc:#262a63}
.ftaddbtn{font:inherit;font-weight:600;font-size:13px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 15px;cursor:pointer;flex:none}
.ftaddbtn:hover{filter:brightness(1.05)}
.ftask .fdel{font-size:14px;line-height:1;color:var(--ink2);border:none;background:none;cursor:pointer;flex:none;opacity:.45;padding:0 1px}
.ftask .fdel:hover{opacity:1;color:#c0574f}
.ftask.dragover{box-shadow:0 -2px 0 var(--accent)}
.ftask.hasdraft{flex-wrap:wrap}
.fdraftbtn{font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:7px;padding:3px 9px;cursor:pointer;background:none;flex:none;font-weight:600}
.fdraftbtn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ftask.dopen .fdraftbtn{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.fdraftpanel{flex-basis:100%;width:100%;margin-top:9px;border-top:1px dashed var(--line);padding-top:10px;cursor:default}
.fnote{font-size:12px;color:var(--ink2);line-height:1.45;margin-bottom:9px;font-style:italic}
.fdrafttop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px}
.fdlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700}
.fcopy{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:7px;padding:4px 13px;cursor:pointer;flex:none}
.fcopy:hover{filter:brightness(1.05)}
.fdraftpre{white-space:pre-wrap;word-wrap:break-word;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:0;max-height:340px;overflow:auto;-webkit-user-select:text;user-select:text}
/* tide */
.tidecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px 16px;margin-top:16px}
.tidescroll{overflow-x:auto}
.tide{display:flex;gap:6px;min-width:660px;align-items:flex-end}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:36px}
.moons{height:16px;display:flex;gap:2px;align-items:center;justify-content:center}
.moon{width:13px;height:13px;border-radius:50%}
.moon.full{background:radial-gradient(circle at 37% 33%,#fbf1c8,var(--moon-full) 62%,var(--moon-shade) 100%);box-shadow:0 0 8px 1px color-mix(in srgb,var(--moon-full) 60%,transparent)}
.moon.new{background:radial-gradient(circle at 40% 36%,#4b4636,var(--moon-dark) 75%);border:1px solid var(--moon-ring)}
.bar-wrap{height:118px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:76%;max-width:30px;border-radius:5px 5px 3px 3px;position:relative;transition:height .8s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:center;min-height:8px}
.bar.l0{background:var(--t0)}.bar.l1{background:var(--t1)}.bar.l2{background:var(--t2)}.bar.l3{background:var(--t3)}.bar.l4{background:var(--t4)}
.bv{position:absolute;top:-16px;font-size:10.5px;color:var(--ink2);font-weight:600}
.tname{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);text-align:center;min-height:12px;line-height:1.1}
.tcol[data-lvl="4"] .tname,.tcol[data-lvl="3"] .tname{color:var(--accent);font-weight:700}
.cyrow{display:flex;gap:1px;width:82%;height:6px}
.cyd{flex:1;border-radius:2px;background:var(--surface2)}
.cyd.c-period{background:var(--c-period)}
.cyd.c-fertile{background:var(--c-fertile)}
.cyd.c-ovul{background:var(--c-ovul);box-shadow:0 0 0 1px var(--surface),0 0 4px var(--c-ovul)}
.wlab{font-size:9.5px;color:var(--ink2)}
.tcol.tnow .wlab{color:var(--accent);font-weight:700}
.tcol.tnow .wlab::before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 auto 3px}
.tidekey{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.tidekey b{color:var(--ink);font-weight:600}
.kk{display:inline-flex;align-items:center;gap:7px}
.kk .d{width:11px;height:11px;border-radius:3px;display:inline-block}
/* daily */
.dailywrap{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 4px 12px}
.daily{display:flex;gap:5px;overflow-x:auto;padding:4px 14px 12px;scroll-snap-type:x proximity}
.dcol{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 3px 7px;border-radius:11px;scroll-snap-align:start}
.dcol.wknd{background:var(--surface2)}
.dcol.today{background:color-mix(in srgb,var(--accent) 13%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent)}
.dwd{font-size:10px;text-transform:uppercase;color:var(--ink2)}
.dnum{font-family:var(--serif);font-size:18px;line-height:1}
.dmoon{height:15px;display:flex;align-items:center}
.ddrop{width:7px;height:7px;border-radius:50%;background:var(--c-period)}.ddrop.blank{background:transparent}
.ddots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:9px;max-width:46px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.dot.big{width:11px;height:11px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.dtot{font-size:10px;color:var(--ink2);font-weight:700;min-height:12px}
.dmon{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.dhint{font-size:12.5px;color:var(--ink2);padding:2px 16px 0}
.dempty{padding:26px 16px;color:var(--ink2);font-size:14px}
/* courses + stats */
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.lg{flex:0 1 240px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:1px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;color:var(--ink);transition:opacity .2s,border-color .2s}
.lg .sw{grid-row:1/3;align-self:center;width:14px;height:14px;border-radius:5px;background:var(--cl)}
.lg .lgn{font-weight:600;font-size:14px}.lg .lgc{font-size:11px;color:var(--ink2);align-self:center}
.lg .lgx{grid-column:2/4;font-size:11.5px;color:var(--ink2)}
.lg:hover{border-color:var(--cl)}.lg.off{opacity:.34}
.stats{display:flex;flex-wrap:wrap;gap:22px 30px;margin-top:18px;padding:2px 4px;color:var(--ink2)}
.stat{display:flex;align-items:baseline;gap:8px;font-size:13px}
.stat b{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:600}
.stat.warm b{color:var(--accent)}
/* timeline */
.timeline{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.wk{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.wk.newmonth{margin-top:30px}
.montab{position:absolute;top:-21px;left:16px;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;padding:4px 15px 7px;font-family:var(--serif);font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--t3)}
.wk[data-lvl="4"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.wkhead h3{font-size:18px}
.wkmeta{display:flex;align-items:center;gap:10px}
.tidepill{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.tidepill.l0{background:var(--t1);color:var(--ink)}.tidepill.l1{background:var(--t2)}.tidepill.l2{background:var(--t2)}.tidepill.l3{background:var(--t3)}.tidepill.l4{background:var(--t4)}
.tidepill.donetag{background:color-mix(in srgb,var(--t3) 45%,var(--ink2) 55%);color:#fff}
.weekdone .wkhead h3,.weekdone .wkpts{opacity:.55}
.wkpts{font-size:13px;color:var(--ink2);font-weight:600}
/* per-week progress: how much of the week's work is cleared (2026-09-22) */
.wkprog{display:inline-flex;align-items:center;gap:7px}
.wkbar{display:inline-block;width:66px;height:6px;border-radius:999px;background:color-mix(in srgb,#2f8f8a 16%,var(--surface2));overflow:hidden;flex:none}
.wkbar i{display:block;height:100%;border-radius:999px;background:#2f8f8a;transition:width .35s ease}
.wkcount{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.weekdone .wkprog{opacity:.55}
@media(max-width:560px){.wkbar{width:42px}.wkcount{font-size:11px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--cl);border-radius:9px;padding:0 11px;height:40px;overflow:hidden;transition:transform .15s,box-shadow .15s,opacity .2s}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.chip .ctype{flex:none;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 5px;white-space:nowrap}

.shorebanner:hover{background:color-mix(in srgb,#2f8f8a 16%,var(--surface));transform:translateY(-1px)}
.shorebanner:focus-visible{outline:2px solid #2f8f8a;outline-offset:2px}
.sbjump{flex:none;color:#2f8f8a;font-size:16px;font-weight:700;line-height:1}
.wkflash{animation:wkflash 1.5s ease}
@keyframes wkflash{0%,100%{background:transparent}25%{background:color-mix(in srgb,#2f8f8a 14%,transparent)}}
.shorebanner .sanchor{font-size:19px;color:#2f8f8a;flex:none}
.sbtext{display:flex;flex-direction:column;line-height:1.2;flex:none}
.sbh{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
.sbtrip{font-size:11px;color:var(--ink2)}
.sbbar{flex:1;height:7px;min-width:50px;border-radius:4px;background:color-mix(in srgb,#2f8f8a 16%,var(--surface));overflow:hidden}
.sbfill{height:100%;background:#2f8f8a;border-radius:4px;transition:width .4s ease}
.sbcount{flex:none;font-size:12px;font-weight:700;color:#2f8f8a;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.shoreleave{border-left-color:#2f8f8a;background:color-mix(in srgb,#2f8f8a 7%,var(--surface2))}
.chip .canchor{flex:none;font-size:12px;color:#2f8f8a;line-height:1}
@media(max-width:560px){.shorebanner{flex-wrap:wrap}.sbbar{order:5;flex-basis:100%}}
/* modules & lectures (per-course lecture map) */
.moddetails{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.modsummary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.modsummary::-webkit-details-marker{display:none}
.modsummary::after{content:"\203A";margin-left:auto;color:var(--ink2);font-size:20px;transform:rotate(90deg);transition:transform .2s}
.moddetails[open] .modsummary::after{transform:rotate(-90deg)}
.moddetails[open] .modlist{margin-top:16px}
.modsumh{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.modsump{font-size:12.5px;color:var(--ink2)}
.modlist{display:flex;flex-direction:column;gap:10px}
.modcourse{border:1px solid var(--line);border-left:3px solid var(--cl);border-radius:11px;background:var(--surface2);overflow:hidden}
.modchead{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px}
.modchead::-webkit-details-marker{display:none}
.modchead::after{content:"\203A";margin-left:8px;color:var(--ink2);font-size:19px;transform:rotate(90deg);transition:transform .2s}
.modcourse[open] .modchead::after{transform:rotate(-90deg)}
.modccode{font-size:11px;font-weight:700;color:var(--cl);letter-spacing:.04em}
.modcname{font-size:14px;font-weight:600;color:var(--ink)}
.modcsum{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--cl);font-variant-numeric:tabular-nums}
.modrows{display:flex;flex-direction:column;gap:5px;padding:0 13px 13px}
.modrow{border:1px solid var(--line);border-radius:8px;background:var(--surface2);overflow:hidden}
.modrow.flat{padding:9px 12px}
.modrow>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 12px}
.modrow>summary::-webkit-details-marker{display:none}
.modrow[open]{background:color-mix(in srgb,var(--cl) 6%,var(--surface2))}
.modm{flex:none;width:82px;font-size:12px;font-weight:600;color:var(--ink)}
.modbar{flex:1;height:7px;border-radius:4px;background:color-mix(in srgb,var(--cl) 13%,var(--surface));overflow:hidden}
.modbar.empty{background:transparent;border:1px dashed var(--line)}
.modfill{height:100%;background:var(--cl);border-radius:4px;transition:width .35s ease}
.modcount{flex:none;min-width:50px;text-align:right;font-size:11.5px;font-weight:700;color:var(--cl);font-variant-numeric:tabular-nums}
.modrow.flat .modcount{color:var(--ink2)}
.modlecs{margin:0;padding:2px 13px 11px 95px;list-style:none;display:flex;flex-direction:column;gap:5px}
.modlec{font-size:12.5px;color:var(--ink2);position:relative;padding-left:17px;line-height:1.35}
.modlec::before{content:"\25CB";position:absolute;left:0;font-size:10px;top:2px;color:var(--ink2)}
.modlec.watched{color:var(--ink);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--cl) 55%,transparent)}
.modlec.watched::before{content:"\25CF";color:var(--cl)}
@media(max-width:640px){.modlecs{padding-left:24px}.modm{width:64px}}
/* MULI work calls (her lane) */
.mulidetails{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.mulisummary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.mulisummary::-webkit-details-marker{display:none}
.mulisummary::after{content:"\203A";margin-left:auto;color:var(--ink2);font-size:20px;transform:rotate(90deg);transition:transform .2s}
.mulidetails[open] .mulisummary::after{transform:rotate(-90deg)}
.mulidetails[open] .mulilist{margin-top:14px}
.mulih{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--t3);letter-spacing:.06em}
.mulitoday{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--t3);padding:2px 9px;border-radius:20px}
.mulisub{font-size:12.5px;color:var(--ink2)}
.mulirow{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--t3);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.mulirow:last-child{margin-bottom:0}
.mulitop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.muliname{font-weight:600;font-size:14px;color:var(--ink)}
.muliwhen{font-size:12px;color:var(--t3);font-weight:600;white-space:nowrap}
.mulimeta{font-size:11.5px;color:var(--ink2);margin-top:5px;font-variant-numeric:tabular-nums}
.mulijoin{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:600;color:#fff;background:var(--t3);padding:6px 15px;border-radius:8px;text-decoration:none}
.mulijoin:hover{opacity:.9}
/* epigraph */
.epigraph{margin-top:44px;padding:26px 24px;border-top:1px solid var(--line);text-align:center}
.epigraph blockquote{margin:0;font-family:var(--serif);font-size:clamp(17px,2.4vw,21px);line-height:1.5;color:var(--ink);max-width:44ch;margin-inline:auto;text-wrap:balance;font-style:italic}
.epigraph cite{display:block;margin-top:12px;font-family:var(--sans);font-style:normal;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.sandbox{margin-top:40px;width:100vw;position:relative;left:50%;margin-left:-50vw;border-radius:0;overflow:hidden}
#sand{display:block;width:100%;height:160px}
a{color:var(--accent)}
@media (max-width:760px){.toprow{grid-template-columns:1fr}.rgrid{grid-template-columns:1fr;gap:26px}}
@media (max-width:620px){
  .chips{flex-direction:column;gap:7px}
  .chip{width:100%!important;height:auto;min-height:42px;padding:8px 11px;align-items:flex-start}
  .chip .star{top:8px}
  .chip .ctext{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.28}
  .chip .cmeta{align-self:center}
}
@media (max-width:560px){.bar-wrap{height:96px}.tide{min-width:600px}.crossing{flex-direction:column}.glass{width:100%;height:74px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gate{min-height:60vh;display:flex;align-items:center;justify-content:center}
.gatecard{max-width:320px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 28px;box-shadow:var(--shadow)}
.gatecard .gt{font-family:var(--serif);font-size:38px;margin-bottom:6px}
.gatecard .gs{color:var(--ink2);font-size:14px;margin-bottom:18px}
.gatecard input[type=password]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:12px}
.gatecard .grem{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12.5px;color:var(--ink2);margin-bottom:16px}
.gatecard button{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 22px;cursor:pointer;width:100%}
.gatecard button:hover{filter:brightness(1.05)}
.gatecard .gerr{color:#c0574f;font-size:12.5px;margin-top:12px;min-height:16px}
</style>

function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryUnlock(pw,remember){
  try{
    const key=await deriveKey(pw,b64d(ENC.s));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.i)},key,b64d(ENC.c));
    const payload=JSON.parse(new TextDecoder().decode(pt));
    if(remember){try{localStorage.setItem('marea_pw',pw);}catch(e){}}
    render(payload); return true;
  }catch(e){return false;}
}

    function duneY(x){return H-15-9*Math.sin(x/95)-5*Math.sin(x/36+1.3);}
    function resize(){
      W=cv.clientWidth||600; H=cv.clientHeight||150; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
      fall=[]; for(var i=0;i<Math.round(W/7);i++)fall.push(mk(false));
      stars=[]; for(var j=0;j<Math.round(W/9);j++)stars.push({x:rnd(0,W),y:rnd(0,H*0.72),r:rnd(0.4,1.5),tw:rnd(0,6.28),tv:rnd(0.008,0.03),c:Math.random()});
    }
    function frame(){
      var d=dark(); ctx.clearRect(0,0,W,H);
      var g=ctx.createLinearGradient(0,0,0,H);
      if(d){g.addColorStop(0,'rgba(20,17,34,0)');g.addColorStop(.55,'rgba(28,23,52,0.35)');g.addColorStop(1,'rgba(46,38,86,0.65)');}
      else{g.addColorStop(0,'rgba(236,224,196,0)');g.addColorStop(.55,'rgba(224,208,168,0.32)');g.addColorStop(1,'rgba(203,182,134,0.62)');}
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      if(d){for(var si=0;si<stars.length;si++){var s=stars[si]; s.tw+=s.tv; var a=(0.35+0.6*Math.abs(Math.sin(s.tw))).toFixed(2); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fillStyle=(s.c<0.85?'rgba(214,222,248,':(s.c<0.95?'rgba(150,180,240,':'rgba(240,214,150,'))+a+')'; ctx.fill();}}
      ctx.beginPath(); ctx.moveTo(0,H); for(var x=0;x<=W;x+=6)ctx.lineTo(x,duneY(x)); ctx.lineTo(W,H); ctx.closePath();
      var dg=ctx.createLinearGradient(0,H-34,0,H);
      if(d){dg.addColorStop(0,'#37306a');dg.addColorStop(1,'#100d20');} else {dg.addColorStop(0,'#e4d2a4');dg.addColorStop(1,'#c1aa76');}
      ctx.fillStyle=dg; ctx.fill();
      for(var k=0;k<W/3;k++){var gx=rnd(0,W),gy=rnd(duneY(gx),H); ctx.fillStyle=d?'rgba(185,180,235,'+rnd(0.05,0.22).toFixed(2)+')':'rgba(120,95,55,'+rnd(0.05,0.2).toFixed(2)+')'; ctx.fillRect(gx,gy,1,1);}
      for(var fi=0;fi<fall.length;fi++){var p=fall[fi]; var col; if(d){col=p.c<0.72?'rgba(222,228,248,':(p.c<0.9?'rgba(150,182,242,':'rgba(242,216,150,');} else {col='rgba('+((212-p.c*46)|0)+','+((188-p.c*44)|0)+','+((142-p.c*42)|0)+',';} var al=(0.45+0.4*Math.abs(Math.sin(p.ph+p.y*0.04))).toFixed(2); ctx.fillStyle=col+al+')'; ctx.fillRect(p.x,p.y,p.s,p.s); if(!reduce){p.y+=p.v; p.x+=p.dx;} if(p.y>duneY(p.x)-1){var nn=mk(true); p.x=nn.x;p.y=nn.y;p.v=nn.v;p.s=nn.s;p.dx=nn.dx;p.c=nn.c;p.ph=nn.ph;}}
      if(!reduce) raf=requestAnimationFrame(frame);
    }
    function start(){cancelAnimationFrame(raf); resize(); frame();}
    start();
    var rt; window.addEventListener('resize',function(){clearTimeout(rt); rt=setTimeout(start,150);});
    new MutationObserver(function(){ if(reduce) frame(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  })();

}
(function(){
  var g=document.getElementById('gate');

  function showGate(){

    var inp=document.getElementById('gpw');
    function go(){var pw=inp.value; if(!pw)return; document.getElementById('gerr').textContent=''; tryUnlock(pw,document.getElementById('grem').checked).then(function(ok){if(!ok){document.getElementById('gerr').textContent='Wrong password.'; inp.value='';}});}
    document.getElementById('gbtn').addEventListener('click',go);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
    inp.focus();
  }
  if(saved){tryUnlock(saved,false).then(function(ok){if(!ok)showGate();});}
  else showGate();
})();
