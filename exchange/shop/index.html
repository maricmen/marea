<style>
/* Password gate. The app itself is encrypted below and only decrypted in this
   browser. This wrapper is the only plaintext on the public page. */
:root{--bg:#f7f3ea;--surface:#fffdf8;--line:#e2dac8;--ink:#2b2822;--ink3:#857e6e;--accent:#3d6b4f;--accent-ink:#fff;--warn:#a4461e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--surface:#211e17;--line:#3b3529;--ink:#eee7d8;--ink3:#8f8775;--accent:#8cc49c;--accent-ink:#11200f;--warn:#f0a37e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-block-size:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-inline:16px}
.box{inline-size:100%;max-inline-size:340px;text-align:center}
h1{font-size:1.3rem;font-weight:650;margin-block:0 4px}
p{color:var(--ink3);font-size:.9rem;margin-block:0 18px}
input{inline-size:100%;min-block-size:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:center;padding-inline:12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{inline-size:100%;min-block-size:48px;margin-block-start:10px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--warn);min-block-size:1.4em;margin-block:12px 0;font-size:.9rem}
</style>

function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decrypt(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(PAYLOAD.s),iterations:PAYLOAD.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAYLOAD.i)},key,b64d(PAYLOAD.c));
  return new TextDecoder().decode(pt);
}
function remember(pw){try{localStorage.setItem('exchange_pw',pw);}catch(e){}}
function saved(){var out=[];try{var a=localStorage.getItem('exchange_pw');if(a)out.push(a);var b=localStorage.getItem('marea_pw');if(b&&b!==a)out.push(b);}catch(e){}return out;}
// Replace the whole page with the decrypted app. document.write runs the
// app's own scripts; setting innerHTML would not.
function show(html){document.open();document.write(html);document.close();}
async function tryOpen(pw,keep){
  try{var html=await decrypt(pw);if(keep)remember(pw);show(html);return true;}catch(e){return false;}
}
document.getElementById('gate').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var pw=document.getElementById('pw').value;if(!pw)return;
  var btn=document.getElementById('open');btn.disabled=true;
  document.getElementById('err').textContent='';
  var ok=await tryOpen(pw,true);
  if(!ok){btn.disabled=false;document.getElementById('err').textContent='That is not it. · No es esa.';document.getElementById('pw').select();}
});
(async function(){
  var list=saved();
  for(var i=0;i<list.length;i++){if(await tryOpen(list[i],true))return;}
  try{localStorage.removeItem('exchange_pw');}catch(e){}
  document.getElementById('pw').focus();
})();
</script>
